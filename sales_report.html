<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博士伦润洁 2026 H1 销售数据分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--accent:#1a73e8;--bg:#f8f9fa;--card:#fff;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:#333;}
.header{background:linear-gradient(135deg,#1a237e,#0d47a1);color:#fff;padding:24px 32px}
.header h1{font-size:24px;margin-bottom:4px}
.header p{opacity:.8;font-size:14px}
.container{max-width:1400px;margin:0 auto;padding:20px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.kpi{background:var(--card);border-radius:12px;padding:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kpi .val{font-size:28px;font-weight:700;color:var(--accent)}
.kpi .lbl{font-size:12px;color:#999;margin-top:4px}
.card{background:var(--card);border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:18px;color:#1a237e;margin-bottom:16px;border-bottom:2px solid #e8eaf6;padding-bottom:8px}
.chart-wrap{position:relative;height:400px}
.chart-wrap.tall{height:500px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th{background:#f5f5f5;padding:8px 10px;text-align:left;font-weight:600}
td{padding:6px 10px;border-bottom:1px solid #eee}
.positive{color:#2e7d32}
.negative{color:#c62828}
@media(max-width:768px){.row2,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <h1>博士伦润洁 · 2026年H1销售数据分析</h1>
  <p>淘闪 & 美团 | 2026年1-6月 | OTC/RX</p>
</div>
<div class="container">
  <div class="kpi-row" id="kpiRow"></div>

  <!-- View 1: Platform x Month -->
  <div class="card">
    <h2>📊 一、By平台 By月 销售额/销量/环比/平台占比</h2>
    <div class="chart-wrap"><canvas id="c1_sales"></canvas></div>
    <div class="row2">
      <div class="chart-wrap"><canvas id="c1_volume"></canvas></div>
      <div class="chart-wrap"><canvas id="c1_mom"></canvas></div>
    </div>
    <div class="chart-wrap"><canvas id="c1_share"></canvas></div>
    <table id="t1"></table>
  </div>

  <!-- View 2: Platform x OTC/RX x Month -->
  <div class="card">
    <h2>📊 二、By平台 By(OTC/RX) By月 销售额/销量/环比/平台占比</h2>
    <div class="chart-wrap tall"><canvas id="c2_sales"></canvas></div>
    <div class="row2">
      <div class="chart-wrap"><canvas id="c2_taobao"></canvas></div>
      <div class="chart-wrap"><canvas id="c2_meituan"></canvas></div>
    </div>
    <table id="t2"></table>
  </div>

  <!-- View 4: Top 15 Cities -->
  <div class="card">
    <h2>📊 四、By平台 26H1 OTC/RX 销售额TOP15城市</h2>
    <div class="row2">
      <div class="chart-wrap tall"><canvas id="c4_taobao"></canvas></div>
      <div class="chart-wrap tall"><canvas id="c4_meituan"></canvas></div>
    </div>
  </div>

  <!-- View 5: Product User Share -->
  <div class="card">
    <h2>📊 五、By平台 By(OTC/RX) By单品 26H1用户数占比</h2>
    <div class="row2">
      <div class="chart-wrap tall"><canvas id="c5_taobao"></canvas></div>
      <div class="chart-wrap tall"><canvas id="c5_meituan"></canvas></div>
    </div>
  </div>
</div>

润舒]氯霉素滴眼液(10ml:25mg)*10ml/瓶/盒", "users": 55345, "share": 1.9}, {"product": "[博士伦润洁]氯化钠滴眼液(不含防腐剂)0.4ml*10支/盒", "users": 51209, "share": 1.8}, {"product": "[博士伦正大捷普]阿昔洛韦滴眼液(8ml:8mg)*8ml/支/盒", "users": 36271, "share": 1.3}, {"product": "[博士伦海普林]肝素钠乳膏20g/支/盒", "users": 34123, "share": 1.2}]}};

// KPI Row
(function(){
  const m = DATA.meta;
  const v1 = DATA.v1_platform_monthly;
  let h = '';
  h += '<div class="kpi"><div class="val">'+(m.total_sales/10000).toFixed(0)+'万</div><div class="lbl">H1总销售额</div></div>';
  for (const p of Object.keys(v1)) {
    h += '<div class="kpi"><div class="val">'+(v1[p]._total/10000).toFixed(0)+'万</div><div class="lbl">'+p+'销售额</div></div>';
    h += '<div class="kpi"><div class="val">'+v1[p]._share+'%</div><div class="lbl">'+p+'占比</div></div>';
  }
  document.getElementById('kpiRow').innerHTML = h;
})();

function chart(id, type, labels, datasets, options) {
  new Chart(document.getElementById(id), {type, data:{labels, datasets}, options: Object.assign({responsive:true,maintainAspectRatio:false}, options||{})});
}

const MONTHS = ['01','02','03','04','05','06'];
const MONTH_LABELS = ['1月','2月','3月','4月','5月','6月'];

// ===== View 1 =====
(function(){
  const v1 = DATA.v1_platform_monthly;
  const platforms = Object.keys(v1);
  const colors = {'淘闪':'#ff6f00','美团':'#1a73e8'};

  // Sales
  chart('c1_sales', 'bar', MONTH_LABELS, platforms.map(p=>({
    label:p, data:MONTHS.map(m=>(v1[p][m]?v1[p][m].sales/10000:0)),
    backgroundColor:colors[p]+'aa', borderColor:colors[p], borderWidth:1
  })), {plugins:{title:{text:'月销售额（万元）',display:true}}});

  // Volume
  chart('c1_volume', 'bar', MONTH_LABELS, platforms.map(p=>({
    label:p, data:MONTHS.map(m=>(v1[p][m]?v1[p][m].volume/10000:0)),
    backgroundColor:colors[p]+'aa', borderColor:colors[p], borderWidth:1
  })), {plugins:{title:{text:'月销量（万件）',display:true}}});

  // MoM
  chart('c1_mom', 'line', MONTH_LABELS, platforms.map(p=>({
    label:p+'环比', data:MONTHS.map(m=>(v1[p][m]?v1[p][m].mom||0:0)),
    borderColor:colors[p], backgroundColor:colors[p]+'33', fill:false, tension:.3
  })), {plugins:{title:{text:'月销售额环比(%)',display:true}},scales:{y:{beginAtZero:true}}});

  // Platform Share (pie)
  chart('c1_share', 'doughnut', platforms, [{
    data: platforms.map(p=>v1[p]._share),
    backgroundColor: platforms.map(p=>colors[p]+'cc'),
    borderColor: platforms.map(p=>colors[p]), borderWidth:2
  }], {plugins:{title:{text:'平台销售额占比',display:true}}});

  // Table
  let th='<tr><th>月份</th>';
  for(const p of platforms) th+='<th>'+p+'销售额</th><th>'+p+'环比</th><th>'+p+'销量</th>';
  th+='</tr>';
  let tb='';
  for(let i=0;i<6;i++){
    const m=MONTHS[i];
    tb+='<tr><td><strong>'+MONTH_LABELS[i]+'</strong></td>';
    for(const p of platforms){
      const d=v1[p][m]||{};
      tb+='<td>'+(d.sales/10000).toFixed(0)+'万</td>';
      const mom=d.mom||0;
      tb+='<td class="'+(mom>=0?'positive':'negative')+'">'+(mom>=0?'+':'')+mom+'%</td>';
      tb+='<td>'+(d.volume/10000).toFixed(1)+'万</td>';
    }
    tb+='</tr>';
  }
  document.getElementById('t1').innerHTML=th+tb;
})();

// ===== View 2 =====
(function(){
  const v2 = DATA.v2_otc_rx_monthly;
  const keys = Object.keys(v2).sort();
  const colors2 = ['#e91e63','#ff9800','#4caf50','#2196f3','#9c27b0','#00bcd4'];

  let th2='<tr><th>平台/品类</th>';
  for(const m of MONTHS) th2+='<th>'+MONTH_LABELS[parseInt(m)-1]+'销售额</th><th>'+MONTH_LABELS[parseInt(m)-1]+'销量</th>';
  th2+='<th>H1合计</th></tr>';
  let tb2='';
  for(let i=0;i<keys.length;i++){
    const k=keys[i]; const d=v2[k];
    tb2+='<tr><td><strong>'+k+'</strong></td>';
    let total=0;
    for(const m of MONTHS){
      const md=d[m]||{};
      tb2+='<td>'+(md.sales/10000).toFixed(0)+'万</td>';
      tb2+='<td>'+(md.volume/10000).toFixed(1)+'万</td>';
      total+=md.sales;
    }
    tb2+='<td><strong>'+(d._total/10000).toFixed(0)+'万</strong></td></tr>';
  }
  document.getElementById('t2').innerHTML=th2+tb2;

  // Combined chart
  chart('c2_sales', 'bar', MONTH_LABELS, keys.map((k,i)=>({
    label:k, data:MONTHS.map(m=>((v2[k][m]||{}).sales/10000||0)),
    backgroundColor:colors2[i%6]+'aa', borderColor:colors2[i%6], borderWidth:1
  })), {plugins:{title:{text:'各平台/品类月销售额（万元）',display:true}}});

  // Split by platform
  const taobaoKeys = keys.filter(k=>k.startsWith('淘闪'));
  const mtKeys = keys.filter(k=>k.startsWith('美团'));
  if(taobaoKeys.length) chart('c2_taobao','bar',MONTH_LABELS, taobaoKeys.map((k,i)=>({label:k.split('|')[1],data:MONTHS.map(m=>((v2[k][m]||{}).sales/10000||0)),backgroundColor:colors2[i]+'aa',borderColor:colors2[i],borderWidth:1})), {plugins:{title:{text:'淘闪-各品类月销售额（万元）',display:true}}});
  if(mtKeys.length) chart('c2_meituan','bar',MONTH_LABELS, mtKeys.map((k,i)=>({label:k.split('|')[1],data:MONTHS.map(m=>((v2[k][m]||{}).sales/10000||0)),backgroundColor:colors2[i+2]+'aa',borderColor:colors2[i+2],borderWidth:1})), {plugins:{title:{text:'美团-各品类月销售额（万元）',display:true}}});
})();

// ===== View 4: Top 15 Cities =====
(function(){
  const v4 = DATA.v4_top15_cities;
  for(const p of Object.keys(v4)){
    const cities = v4[p];
    const id = p==='淘闪'?'c4_taobao':'c4_meituan';
    chart(id, 'bar', cities.map(c=>c.city).reverse(), [{
      label:p+'销售额', data: cities.map(c=>c.sales/10000).reverse(),
      backgroundColor: (p==='淘闪'?'#ff6f00':'#1a73e8')+'aa',
      borderColor: p==='淘闪'?'#ff6f00':'#1a73e8', borderWidth:1
    }], {indexAxis:'y', plugins:{title:{text:p+' TOP15城市销售额（万元）',display:true}}});
  }
})();

// ===== View 5: Product User Share =====
(function(){
  const v5 = DATA.v5_product_users;
  for(const p of Object.keys(v5)){
    const prods = v5[p].slice(0,10);
    const id = p==='淘闪'?'c5_taobao':'c5_meituan';
    chart(id, 'bar', prods.map(p=>p.product).reverse(), [{
      label:'用户数', data: prods.map(p=>p.users/10000).reverse(),
      backgroundColor: (p==='淘闪'?'#ff6f00':'#1a73e8')+'aa',
      borderColor: p==='淘闪'?'#ff6f00':'#1a73e8', borderWidth:1
    }], {indexAxis:'y', plugins:{title:{text:p+' TOP10单品用户数（万）',display:true}}});
  }
})();
</script>
</body>
</html>
